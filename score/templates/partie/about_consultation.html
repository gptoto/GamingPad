{% extends "partie/base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Suggestions recues</h1>

<table class="table">
    <thead>
        <tr><th>Nom</th><th>Message</th><th>Date</th></tr>
    </thead>
    <tbody>
        {% for s in suggestions %}
        <tr>
            <td>{{ s.nom }}</td>
            <td>{{ s.message }}</td>
            <td>{{ s.dateEnvoi }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
