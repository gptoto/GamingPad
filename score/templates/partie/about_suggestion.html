{% extends "partie/base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-1">Suggestion ou anomalie</h1>
<p class="opacity-60 mb-4">Un souci, une idee ? Dis-le ici.</p>

<form method="POST" class="space-y-4 flex flex-col">
    {% csrf_token %}
    {{ form.nom }}
    {{ form.message }}
    <button type="submit" class="btn btn-primary">Envoyer</button>
</form>

{% if envoi_reussi %}
<div class="toast toast-top toast-center" id="toast-succes" style="top: 100px;">
    <div class="alert alert-success">
        <span>Message envoyé, merci !</span>
    </div>
</div>
{% endif %}

<script>
const toastSucces = document.getElementById('toast-succes');
if (toastSucces) {
    setTimeout(function() {
        toastSucces.style.transition = 'opacity 1s';
        toastSucces.style.opacity = '0';
    }, 2500);
}
</script>
{% endblock %}
